[workspace]
resolver = "2"
members = ["crates/notekroft-core", "crates/notekroft-onenote", "src-tauri"]

[workspace.package]
version = "0.4.1"
edition = "2021"
license = "GPL-3.0-or-later"
repository = "https://github.com/morningjon/notekroft"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
