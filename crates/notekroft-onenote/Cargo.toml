[package]
name = "notekroft-onenote"
description = "Imports Microsoft OneNote section and notebook files into a NoteKroft library."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
onenote_parser = "2"
serde = { version = "1", features = ["derive"] }
thiserror = "2"
notekroft-core = { path = "../notekroft-core" }
typed-path = "0.12"

[dev-dependencies]
tempfile = "3"
