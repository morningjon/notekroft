<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <title>TwoNote</title>
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <div id="app">
      <header class="topbar">
        <div class="tabs-row">
          <div class="brand">
            <img src="/icon.svg" alt="" width="20" height="20" />
            <span>TwoNote</span>
          </div>
          <div class="tabs" id="tabs" role="tablist" aria-label="Ribbon tabs"></div>
          <div class="search" id="search-box">
            <input id="search" type="search" placeholder="Search all notebooks (Ctrl+E)" autocomplete="off" spellcheck="false" aria-label="Search all notebooks" />
            <div id="search-results" class="search-results" hidden></div>
          </div>
        </div>
        <div class="ribbon" id="ribbon" role="toolbar" aria-label="Ribbon"></div>
      </header>

      <div class="workspace">
        <nav class="nav" aria-label="Notebook navigation">
          <button type="button" id="nb-picker" class="nb-picker" title="Switch notebook">
            <span class="nb-dot"></span>
            <span id="nb-title" class="nb-title">No notebook</span>
            <span class="caret">▾</span>
          </button>
          <div class="nav-cols">
            <div class="col sections">
              <ul id="sections" aria-label="Sections"></ul>
              <button type="button" id="add-section" class="add">+ Add section</button>
            </div>
            <div class="col pages">
              <ul id="pages" aria-label="Pages"></ul>
              <button type="button" id="add-page" class="add">+ Add page</button>
            </div>
          </div>
        </nav>

        <main class="editor" id="editor">
          <div class="sheet" id="page" hidden>
            <div class="page-head">
              <input id="title" class="title" type="text" placeholder="Untitled page" maxlength="200" autocomplete="off" aria-label="Page title" />
              <div id="stamp" class="stamp"></div>
            </div>
            <div id="canvas" class="canvas"></div>
          </div>
          <div class="empty" id="empty"></div>
        </main>
      </div>

      <footer class="status">
        <button type="button" id="lib-path" class="lib-path"></button>
        <span id="save-state" class="save-state"></span>
      </footer>
    </div>
    <input id="image-file" type="file" accept="image/png,image/jpeg,image/gif,image/webp" multiple hidden />
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
